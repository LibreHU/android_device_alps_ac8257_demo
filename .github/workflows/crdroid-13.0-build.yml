name: crDroid 9 (Android 13) build (lineage_ac8257_demo, crDroid port)

# crDROID BRANCH (19/11/2026, from lineage-20.0): crDroid 9 (Android 13), built from the crDroid manifest
# (github.com/crdroidandroid/android). The LibreHU source fixes (tools/patch_lineage_sources.sh) were written
# for LineageOS: a fix that no longer applies is a warning (LIBREHU_PATCH_SOFT=1) so that the build goes on and
# shows the next errors; nothing is published until all of them apply (and the crDroid Updater reads another
# JSON format than LineageOS's: the feed is still the LineageOS one). No ccache (the Actions cache stays for
# 16.0 / 17.1).
# PORT BRANCH (19/11/2026, from lineage-17.1): crDroid 9 (Android 13) (Android 13). The LibreHU source fixes
# (tools/patch_lineage_sources.sh) were written for Android 10: here a fix that no longer applies is a warning
# (LIBREHU_PATCH_SOFT=1) so that the build goes on and shows the next errors; nothing is published (release,
# updater feed) until all of them apply. No ccache (the repository's 10 GB of Actions cache stays for 16.0 / 17.1).
# The ROM's /system built by GitHub Actions, to find the build errors before a build at home (docs/BUILD.md does
# the same steps). Only `systemimage`: the vendor image is the user's own (never published) and the boot image is
# the LibreHU kernel's CI image. Runs on a push to crdroid-13.0 whose message holds "[build]", or by hand.
# Kept apart from the lineage-16.0 build (its own workflow file there): own concurrency group, ccache key prefix,
# release tags (crdroid-13.0-*) and updater feed (release crdroid-13.0-ota); it never touches lineage-16.0-ota.
# Disk (146 GB, /mnt on the same disk): the runner's toolchains are removed, and the Git objects of the checkout
# after the sync; sources in /mnt, output and ccache in /.
# Outputs: the build log always; when it builds: a TWRP zip (tools/make_flashable_zip.py), system.img (sparse,
# zstd) and the LibreHU boot images for fastboot.
on:
  push:
    branches: [crdroid-13.0]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    # On the job, not the workflow: a push without "[build]" (skipped job) does not cancel a build in progress.
    concurrency:
      group: crdroid-13.0-build
      cancel-in-progress: true
    # Releases (zip signe et images) et flux de mises a jour de l'appli Updater de LineageOS ; actions: write pour
    # effacer les anciens caches ccache de cette branche (un seul garde : la limite de 10 Go du depot est partagee
    # avec ceux de lineage-16.0).
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      SRC: /mnt/lineage
      OUT_DIR: /home/runner/out
      CCACHE_DIR: /home/runner/.ccache
      USE_CCACHE: "0"
      CCACHE_EXEC: /usr/bin/ccache
      WITHOUT_CHECK_API: "true"
      # No VNDK ABI dumps (header-abi-dumper on every source file of the VNDK libraries, ~1 h on the runner): a
      # check of the build only, the libraries and the images are the same (cc/cc.go, createVndkSourceAbiDump).
      SKIP_ABI_CHECKS: "true"
      LC_ALL: C
    steps:
      - name: Free the runner's disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm /usr/local/julia* /opt/az \
            /usr/local/share/vcpkg /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/share/kotlinc /opt/pipx /usr/local/n /usr/share/sbt /usr/share/gradle-* /usr/share/apache-maven-* \
            "$HOME/.rustup" "$HOME/.cargo"
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo apt-get remove -y --purge '^llvm-.*' '^clang-.*' '^php.*' '^mysql-.*' '^mongodb-.*' '^dotnet-.*' \
            azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel >/dev/null 2>&1 || true
          # Never rm -rf a directory of a deb package (google-cloud-cli's /usr/lib/google-cloud-sdk did): its removal
          # script fails, dpkg is left half done and apt-get stops with code 100 (run 43237368518).
          sudo apt-get autoremove -y >/dev/null 2>&1 || true; sudo apt-get clean
          sudo mkdir -p "$SRC" && sudo chown "$USER" "$SRC"
          df -h / /mnt

      # 8 GiB: the build in its 13 GiB cgroup used 1.1 GiB of swap at most (run 43227394988), and the disk is short.
      - name: Swap (8 GiB)
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -g

      - name: Build packages (LineageOS wiki; Android 13's build scripts are Python 3, python2 kept for old tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python2 zstd git-lfs >/dev/null
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          mkdir -p ~/bin && curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "LibreHU CI"
          git config --global user.email "ci@librehu.invalid"
          git config --global color.ui false

      - name: Sources (crDroid 9 (Android 13), this tree, the vendor repository)
        id: sources
        working-directory: /mnt/lineage
        run: |
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --git-lfs --depth=1 -g default,-darwin,-mips --no-clone-bundle
          mkdir -p .repo/local_manifests
          # The vendor repository's own crdroid-13.0 branch: the same proprietary files, autochips.jar as a Soong
          # module (Android.bp).
          cat > .repo/local_manifests/ujc201.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="LibreHU/android_device_alps_ac8257_demo" path="device/alps/ac8257_demo" remote="github" revision="crdroid-13.0" />
            <project name="LibreHU/android_vendor_jancar_ac8257_demo" path="vendor/jancar/ac8257_demo" remote="github" revision="crdroid-13.0" />
          </manifest>
          XML
          for i in 1 2 3 4; do
            repo sync -c -j8 --no-tags --no-clone-bundle --optimized-fetch --force-sync && break
            echo "repo sync failed ($i), again"; sleep 60
          done
          # The WebView prebuilt is a Git LFS file (243 MB); repo sync leaves its pointer, and the build stops on
          # "zip END header not found" (run of 12/11). Only arm64 is used (its APK holds the 32-bit library too).
          (cd external/chromium-webview/prebuilt/arm64 && git lfs install --local && git lfs pull)
          unzip -tq external/chromium-webview/prebuilt/arm64/webview.apk >/dev/null && echo "webview.apk: zip OK"
          # LineageOS fixes (tools/patch_lineage_sources.sh): fs_mgr and libfs_avb see the unit unlocked unless
          # vbmeta.device_state=locked (the Jancar LK reports verifiedbootstate=green even unlocked, and no vbmeta.*
          # with VERIFICATION_DISABLED: vendor was not mounted under 16.0, tries of 12/11), display rotation,
          # inverted backlight, autochips.jar as a Soong boot jar. BoardConfig.mk stops the build if this was not done.
          # Port branch: a fix that no longer applies is a warning, the build goes on (see the top of this file).
          LIBREHU_PATCH_SOFT=1 device/alps/ac8257_demo/tools/patch_lineage_sources.sh
          if LIBREHU_PATCH_SOFT=1 device/alps/ac8257_demo/tools/patch_lineage_sources.sh --check; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LibreHU source fixes incomplete for crDroid 9 (Android 13): nothing will be published"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          # The Git objects of the checkout go: room for the output (run 43227394988 stopped at 94 %, 94181/99724, on
          # "No space left on device"). The build reads no Git metadata: prebuilt kernel (TARGET_NO_KERNEL), no OTA
          # package, and repo is not run again; .repo/manifests and .repo/repo stay.
          du -sh .repo; rm -rf .repo/project-objects .repo/projects
          du -sh /mnt/lineage; df -h / /mnt

      - name: LibreHU apps (librehu/fetch_apks.sh), boot images (tools/fetch_kernel.sh), ViPER driver (tools/fetch_viper.sh)
        working-directory: /mnt/lineage/device/alps/ac8257_demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          librehu/fetch_apks.sh
          # LibreHU kernel experimental-4.19.325, variant a10-lto32: 32 MiB boot images with the stock AVB footer,
          # androidboot.selinux=permissive added, connectivity built in (no module), and librehu_boot32_twrp.zip
          # (prebuilt/boot32) that the ROM zip runs when the boot partition is still 10 MiB
          tools/fetch_kernel.sh
          # ViPERFX_RE driver of the ROM's ViPER4Android app (same version), for the TWRP zip: installed or updated in /vendor
          tools/fetch_viper.sh
          ls -la prebuilt

      - name: Build systemimage
        id: build
        working-directory: /mnt/lineage
        timeout-minutes: 290
        run: |
          # 6 GiB (8 for lineage-16.0): both branches' archives share the repository's 10 GB of Actions cache.
          ccache -M 6G >/dev/null; ccache -o compression=true >/dev/null 2>&1 || true
          # The build in a memory cgroup of its own (13 GiB of RAM, 8 GiB of swap): short of memory, the kernel swaps
          # or kills a build process inside it, never the runner. A runner starved of memory loses its link to GitHub,
          # and the whole log with it ("The hosted runner lost communication with the server", run 43184707906).
          CG=/sys/fs/cgroup/lineage-build
          if [ -f /sys/fs/cgroup/cgroup.controllers ] && sudo mkdir -p $CG \
              && echo 13G | sudo tee $CG/memory.max >/dev/null \
              && { [ ! -f $CG/memory.swap.max ] || echo 8G | sudo tee $CG/memory.swap.max >/dev/null; } \
              && echo $$ | sudo tee $CG/cgroup.procs >/dev/null; then
            echo "build cgroup: memory.max $(cat $CG/memory.max), memory.swap.max $(cat $CG/memory.swap.max 2>/dev/null)"
          else
            echo "no build cgroup (cgroup v2 not writable): the build runs without a memory limit"
          fi
          source build/envsetup.sh
          # Android 14+: the lunch target carries the release config (LineageOS: vendor/lineage/vars/aosp_target_release)
          REL=$(sed -n 's/^aosp_target_release=//p' vendor/lineage/vars/aosp_target_release 2>/dev/null || true)
          lunch lineage_ac8257_demo-${REL:+$REL-}userdebug
          # Progress, memory and free disk every 5 minutes; the whole log is an artifact.
          ( while sleep 300; do
              echo "$(tail -n 1 /home/runner/build.log | cut -c1-160) | $(free -m | awk '/^Mem/{r=$3} /^Swap/{s=$3} END{print "RAM " r " MiB, swap " s " MiB"}'), disk $(df -h / | awk 'NR==2{print $4}') free"
            done ) &
          # signapk : signature du zip (OTA de l'appli Updater, verifiee par RecoverySystem.verifyPackage).
          m -j"$(nproc)" systemimage signapk > /home/runner/build.log 2>&1
        continue-on-error: true

      - name: What failed
        if: always()
        run: |
          grep -n -E "FAILED:|error:|ninja: build stopped|#### failed|neverallow" /home/runner/build.log | head -80 || true
          tail -n 60 /home/runner/build.log || true
          df -h / /mnt; ccache -s | head -20 || true
          # oom_kill > 0: a build process was killed for memory (the FAILED line above names it)
          grep -H . /sys/fs/cgroup/lineage-build/memory.events /sys/fs/cgroup/lineage-build/memory.peak 2>/dev/null || true

      - name: Images to flash (system.img zstd, boot images)
        if: steps.build.outcome == 'success'
        run: |
          P=$OUT_DIR/target/product/ac8257_demo
          ls -la $P | head -40
          # The platform policy must leave fuseblk to the Jancar vendor policy (TARGET_HAS_FUSEBLK_SEPOLICY_ON_VENDOR).
          if grep -q '(genfscon fuseblk ' $P/system/etc/selinux/plat_sepolicy.cil; then
            echo "::error::plat_sepolicy.cil labels fuseblk: conflict with the Jancar vendor policy, the unit would not boot"
            exit 1
          fi
          mkdir -p /home/runner/flash
          zstd -T0 -10 $P/system.img -o /home/runner/flash/system.img.zst
          cp /mnt/lineage/device/alps/ac8257_demo/prebuilt/boot-librehu-bootmenu.img \
             /mnt/lineage/device/alps/ac8257_demo/prebuilt/boot-librehu.img /home/runner/flash/
          cp $P/system/build.prop /home/runner/flash/build.prop || true
          # Android 13 on the Android 9 vendor: the VNDK 28 libraries must be in /system (PRODUCT_EXTRA_VNDK_VERSIONS).
          ls -d $P/system/lib64/vndk-28 $P/system/lib/vndk-28 $P/system/lib64/vndk-sp-28 || {
            echo "::error::no VNDK 28 libraries in /system: the vendor HALs would not load"; exit 1; }
          # Own update channel: a 20.0 build only (the LineageOS Updater installs only the same
          # ro.lineage.build.version, Utils.canInstall), whose Updater reads the crdroid-13.0-ota feed, never another.
          V=$(sed -n 's/^ro.lineage.build.version=//p' $P/system/build.prop)
          [ "$V" = 20.0 ] || echo "::warning::ro.lineage.build.version=$V, not 20.0: not published by this branch (crDroid)"
          U=$(find $P/system -name Updater.apk | head -n 1)
          python3 -I -c '
          import sys, zipfile
          d = zipfile.ZipFile(sys.argv[1]).read("resources.arsc")
          has = lambda t: t.encode() in d or t.encode("utf-16-le") in d
          ok = has("releases/download/crdroid-13.0-ota/updater.json") and not has("lineage-16.0-ota")
          sys.exit(0 if ok else 1)' "$U" || {
            echo "::warning::$U: updater_server_url is not the crdroid-13.0-ota feed (crDroid Updater)"; }
          echo "Updater: feed crdroid-13.0-ota ($U), ro.lineage.build.version=$V"
          # TWRP zip (tools/make_flashable_zip.py): system, boot (selinux permissive), boot32 migration zip,
          # ViPERFX_RE driver; info/lineage_version lets the installer refuse an update from another version.
          D=$(date -u +%Y%m%d)
          python3 /mnt/lineage/device/alps/ac8257_demo/tools/make_flashable_zip.py $P/system.img \
            /mnt/lineage/device/alps/ac8257_demo/prebuilt /home/runner/unsigned.zip \
            --build "crdroid-13.0 $D, tree ${GITHUB_SHA::7}, kernel $(sed -n 's/^version=//p' /mnt/lineage/device/alps/ac8257_demo/prebuilt/modules/release.txt)" \
            --lineage-version "$V"
          # Signature du paquet entier (signapk -w) avec la cle de la ROM (test-keys : celle de otacerts.zip) : l'appli
          # Updater de LineageOS refuse un paquet que RecoverySystem.verifyPackage ne verifie pas. TWRP l'installe
          # comme avant. Le nom n'impose plus d'image de boot : le zip garde celle qui est installee (update-binary).
          K=/mnt/lineage/build/make/target/product/security
          JAVA=$(ls -d /mnt/lineage/prebuilts/jdk/jdk*/linux-x86/bin/java | sort -V | tail -n 1)
          $JAVA -Xmx2g -Djava.library.path=$OUT_DIR/host/linux-x86/lib64 \
            -jar $OUT_DIR/host/linux-x86/framework/signapk.jar -w $K/testkey.x509.pem $K/testkey.pk8 \
            /home/runner/unsigned.zip /home/runner/flash/LibreHU-crDroid-13.0-ac8257_demo-$D-${GITHUB_SHA::7}.zip
          rm -f /home/runner/unsigned.zip
          (cd /home/runner/flash && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      # Release GitHub de chaque build de la branche (zip signe, images, empreintes) et flux de l'appli Updater de
      # crDroid 9 (Android 13) : updater.json de la release « crdroid-13.0-ota », remplace a chaque build (format de
      # packages/apps/Updater, Utils.parseJsonUpdate : datetime = ro.build.date.utc, romtype, version). Les builds
      # 16.0 lisent « lineage-16.0-ota », que ce workflow ne touche jamais : une 20.0 n'est pas proposee a une 16.0.
      - name: GitHub release and LineageOS updater feed
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/crdroid-13.0' && steps.sources.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /home/runner/flash
        run: |
          Z=$(ls LibreHU-crDroid-13.0-*.zip)
          TAG=crdroid-13.0-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}
          DT=$(sed -n 's/^ro.build.date.utc=//p' build.prop)
          TYPE=$(sed -n 's/^ro.lineage.releasetype=//p' build.prop)
          VER=$(sed -n 's/^ro.lineage.build.version=//p' build.prop)
          # Only 20.0 entries in the 20.0 feed (checked again before anything is published).
          [ "$VER" = 20.0 ] || echo "::warning::ro.lineage.build.version=$VER: not published to crdroid-13.0-ota (crDroid)"
          case "$TAG" in crdroid-13.0-*) ;; *) echo "::error::tag $TAG"; exit 1;; esac
          gh release create "$TAG" "$Z" boot-librehu-bootmenu.img boot-librehu.img system.img.zst build.prop SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "crDroid 9 (Android 13) PORTAGE, $(date -u +%d/%m/%Y) (${GITHUB_SHA::7})" \
            --notes "PORTAGE crDroid, jamais essaye sur l'unite. crDroid 9 (Android 13) (Android 13) PORTAGE EXPERIMENTAL pour l'UJC201, arbre ${GITHUB_SHA::7} (branche crdroid-13.0). Portage jamais essaye sur l'unite : sauvegarde TWRP (system, boot, data) avant, et effacer data. Installation : docs/BUILD.md. Zip signe (test-keys) : TWRP. Le vendor reste celui de l'unite."
          printf '{"response":[{"datetime":%s,"filename":"%s","id":"%s","romtype":"%s","size":%s,"url":"%s","version":"%s"}]}\n' \
            "$DT" "$Z" "$(sha256sum "$Z" | cut -d' ' -f1)" "${TYPE:-UNOFFICIAL}" "$(stat -c %s "$Z")" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$Z" "$VER" > updater.json
          cat updater.json
          gh release view crdroid-13.0-ota --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create crdroid-13.0-ota --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "crDroid 9 (Android 13) (experimentale) : flux de mises a jour" \
              --notes "updater.json lu par l'appli Mises a jour de LineageOS (overlay de packages/apps/Updater) ; remplace a chaque build."
          gh release upload crdroid-13.0-ota updater.json --clobber --repo "$GITHUB_REPOSITORY"

      # The images are out: the output goes, room for the ccache archive (its save failed on a full disk, run
      # 43227394988).
      - name: Room for the ccache archive
        if: always()
        run: rm -rf "$OUT_DIR"; df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crdroid-13.0-build-log
          path: /home/runner/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: crdroid-13.0-images
          path: /home/runner/flash
          retention-days: 14

      - name: Result
        if: always()
        run: test "${{ steps.build.outcome }}" = success
