name: WPA3 hotspot (hostapd HAL 1.2) for the Android 11+ ROMs

# hostapd of LineageOS 18.1 (Android 11: hostapd HAL 1.2, WPA3-SAE and WPA2/WPA3 transition for the hotspot) with the
# MediaTek private library, built in the LineageOS 16.0 tree (VNDK 28: Pie's hidl-gen, libhidl and BoringSSL are the
# unit's, as for the WPA3 supplicant of wifi-wpa3.yml), VNDK 28 check (tools/wifi/check_vendor_abi.py), TWRP zips
# librehu_wifi_wpa3_hotspot_twrp.zip and its way back (tools/make_hotspot_zips.py, tools/flashable/wifi-hotspot-wpa3.sh)
# in release wifi-wpa3-hotspot. Android 11 offers WPA3 for the hotspot only with hostapd HAL 1.2
# (frameworks/opt/net/wifi HostapdHal, addAccessPoint_1_2) and the overlay config_wifi_softap_sae_supported (LibreHU
# ROM); the gen4m driver passes the AP's AUTH / ASSOC frames to hostapd (CFG_SUPPORT_SOFTAP_WPA3), which does SAE.
# Android 10 has no WPA3 hotspot: Android 11+ only. In the 16.0 tree of the runner: external/wpa_supplicant_8 of
# lineage-18.1 (hostapd only: its wpa_supplicant/Android.mk emptied, it needs the supplicant HAL 1.3), the .hal files of
# android.hardware.wifi.hostapd@1.1 and @1.2 of lineage-18.1 (Android.bp in Pie's form, tools/ci/pie_hidl_bp.py), this
# branch's wifi/ and the hostapd settings; DPP off in hostapd's android.config (not used by the HAL, newer crypto).
on:
  push:
    branches: [lineage-17.1]
    paths:
      - 'wifi/**'
      - 'tools/wifi/**'
      - 'tools/flashable/wifi-hotspot-wpa3.sh'
      - 'tools/make_hotspot_zips.py'
      - 'tools/ci/pie_hidl_bp.py'
      - '.github/workflows/wifi-hotspot-wpa3.yml'
  workflow_dispatch:

jobs:
  build:
    concurrency:
      group: wifi-wpa3-hotspot
      cancel-in-progress: true
    # release wifi-wpa3-hotspot
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      SRC: /mnt/lineage
      OUT_DIR: /home/runner/out
      CCACHE_DIR: /home/runner/.ccache
      USE_CCACHE: "0"
      CCACHE_EXEC: /usr/bin/ccache
      WITHOUT_CHECK_API: "true"
      # No VNDK ABI dumps (header-abi-dumper on every source file of the VNDK libraries, ~1 h on the runner): a
      # check of the build only, the libraries and the images are the same (cc/cc.go, createVndkSourceAbiDump).
      SKIP_ABI_CHECKS: "true"
      LC_ALL: C
    steps:
      - name: Free the runner's disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm /usr/local/julia* /opt/az \
            /usr/local/share/vcpkg /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/share/kotlinc /opt/pipx /usr/local/n /usr/share/sbt /usr/share/gradle-* /usr/share/apache-maven-* \
            "$HOME/.rustup" "$HOME/.cargo"
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo apt-get remove -y --purge '^llvm-.*' '^clang-.*' '^php.*' '^mysql-.*' '^mongodb-.*' '^dotnet-.*' \
            azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel >/dev/null 2>&1 || true
          # Never rm -rf a directory of a deb package (google-cloud-cli's /usr/lib/google-cloud-sdk did): its removal
          # script fails, dpkg is left half done and apt-get stops with code 100 (run 43237368518).
          sudo apt-get autoremove -y >/dev/null 2>&1 || true; sudo apt-get clean
          sudo mkdir -p "$SRC" && sudo chown "$USER" "$SRC"
          df -h / /mnt

      - name: Swap (8 GiB)
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -g

      - name: Build packages (LineageOS wiki, as for Pie; Android 10's build scripts are still Python 2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python2 zstd git-lfs >/dev/null
          # Android 10's build scripts are still Python 2 ("python").
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          mkdir -p ~/bin && curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "LibreHU CI"
          git config --global user.email "ci@librehu.invalid"
          git config --global color.ui false

      # this branch (lineage-17.1): wifi/, tools/wifi/check_vendor_abi.py, tools/make_wifi_zips.py, wifi-wpa3.sh
      - uses: actions/checkout@v4
        with:
          path: tree17

      - name: Sources (LineageOS 16.0 tree, wpa_supplicant_8 and hostapd HAL 1.1 / 1.2 of LineageOS 18.1)
        working-directory: /mnt/lineage
        run: |
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1 -g default,-darwin,-mips --no-clone-bundle
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/ujc201.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="LibreHU/android_device_alps_ac8257_demo" path="device/alps/ac8257_demo" remote="github" revision="lineage-16.0" />
            <project name="LibreHU/android_vendor_jancar_ac8257_demo" path="vendor/jancar/ac8257_demo" remote="github" revision="lineage-16.0" />
            <remove-project name="LineageOS/android_external_wpa_supplicant_8" />
            <project path="external/wpa_supplicant_8" name="LineageOS/android_external_wpa_supplicant_8" remote="github" revision="lineage-18.1" />
          </manifest>
          XML
          for i in 1 2 3 4; do
            repo sync -c -j8 --no-tags --no-clone-bundle --optimized-fetch --force-sync && break
            echo "repo sync failed ($i), again"; sleep 60
          done
          # android.hardware.wifi.hostapd@1.1 (Android 10) and @1.2 (Android 11): .hal files and Android.bp of
          # lineage-18.1, the Android.bp rewritten in Pie's form
          git clone -q --depth 1 --filter=blob:none --sparse -b lineage-18.1 \
            https://github.com/LineageOS/android_hardware_interfaces /home/runner/hi18
          (cd /home/runner/hi18 && git sparse-checkout set wifi/hostapd/1.1 wifi/hostapd/1.2)
          for v in 1.1 1.2; do
            H=hardware/interfaces/wifi/hostapd/$v
            mkdir -p $H && cp /home/runner/hi18/wifi/hostapd/$v/*.hal /home/runner/hi18/wifi/hostapd/$v/Android.bp $H/
            python3 -I $GITHUB_WORKSPACE/tree17/tools/ci/pie_hidl_bp.py $H
            cat $H/Android.bp
          done
          # hostapd only: the supplicant of Android 11 needs the supplicant HAL 1.3 (absent from Pie) and is not used
          W8=external/wpa_supplicant_8
          printf '%s\n' '# LibreHU WPA3 hotspot CI: hostapd only (wifi-hotspot-wpa3.yml)' > $W8/wpa_supplicant/Android.mk
          sed -i 's/^CONFIG_DPP=y/# CONFIG_DPP=y (LibreHU CI: off, not used by the hostapd HAL)/' $W8/hostapd/android.config
          grep -n -E "^#? ?CONFIG_(SAE|DPP|ACS|IEEE80211W)" $W8/hostapd/android.config
          (cd $W8 && git log --oneline -1 2>/dev/null; grep -m1 -E "VERSION_STR" src/common/version.h)
          # MediaTek private library and the hostapd settings (runner only)
          D=device/alps/ac8257_demo
          cp -r $GITHUB_WORKSPACE/tree17/wifi $D/
          { echo; echo "# LibreHU WPA3 hotspot CI (wifi-hotspot-wpa3.yml): hostapd only"
            echo "WPA_SUPPLICANT_VERSION := VER_0_8_X"; echo "BOARD_WPA_SUPPLICANT_DRIVER :="
            echo "BOARD_HOSTAPD_DRIVER := NL80211"; echo "BOARD_HOSTAPD_PRIVATE_LIB := lib_driver_cmd_mt66xx"; } >> $D/BoardConfig.mk
          tail -n 6 $D/BoardConfig.mk
          ls $D/wifi $D/wifi/lib_driver_cmd_mt66xx
          # LineageOS fixes of the 16.0 tree (BoardConfig.mk stops the build if they were not done)
          $D/tools/patch_lineage_sources.sh
          # VNDK 28 snapshot that the Android 10+ ROMs install for the vendor (arm64 shared libraries only)
          git clone -q --depth 1 --filter=blob:none --sparse -b android-10.0.0_r41 \
            https://android.googlesource.com/platform/prebuilts/vndk/v28 /home/runner/vndk/prebuilts/vndk/v28
          (cd /home/runner/vndk/prebuilts/vndk/v28 && git sparse-checkout set arm64/arch-arm64-armv8-a/shared)
          ls /home/runner/vndk/prebuilts/vndk/v28/arm64/arch-arm64-armv8-a/shared
          # The Git objects of the checkout go: room for the output (run 43227394988 stopped at 94 %, 94181/99724, on
          # "No space left on device"). The build reads no Git metadata: prebuilt kernel (TARGET_NO_KERNEL), no OTA
          # package, and repo is not run again; .repo/manifests and .repo/repo stay.
          du -sh .repo; rm -rf .repo/project-objects .repo/projects
          du -sh /mnt/lineage; df -h / /mnt

      - name: LibreHU apps (librehu/fetch_apks.sh), boot images (tools/fetch_kernel.sh), ViPER driver (tools/fetch_viper.sh)
        working-directory: /mnt/lineage/device/alps/ac8257_demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # files the 16.0 product makefiles copy (lunch reads them), as in its ROM build
          librehu/fetch_apks.sh
          tools/fetch_kernel.sh
          # ViPERFX_RE driver of the ROM's ViPER4Android app (same version), for the TWRP zip: installed or updated in /vendor
          tools/fetch_viper.sh
          ls -la prebuilt

      - name: WPA3 hotspot hostapd (HAL 1.2), build and VNDK 28 check
        id: hostapd
        working-directory: /mnt/lineage
        run: |
          source build/envsetup.sh
          lunch lineage_ac8257_demo-userdebug
          # The emptied wpa_supplicant/Android.mk no longer defines libwpa_client, which FrameworksWifiTests of Pie lists
          # (run 44902881517, Kati: "missing libwpa_client"): missing modules allowed, only hostapd is built (a module
          # hostapd needs and that is missing still fails its own build)
          ALLOW_MISSING_DEPENDENCIES=true m -j"$(nproc)" hostapd > /home/runner/hostapd-build.log 2>&1 || {
            grep -n -E "FAILED:|error:" /home/runner/hostapd-build.log | head -40; tail -n 40 /home/runner/hostapd-build.log; exit 1; }
          P=$OUT_DIR/target/product/ac8257_demo
          W=/home/runner/hostapd; mkdir -p $W/bin $W/lib64
          cp $P/vendor/bin/hw/hostapd $W/bin/
          # vendor copies of the HAL 1.1 and 1.2 libraries (not in the unit's VNDK 28), stripped (Pie leaves this
          # vendor variant unstripped), dynamic symbols kept for the check below
          for v in 1.1 1.2; do
            L=android.hardware.wifi.hostapd@$v.so
            H=$P/vendor/lib64/$L
            [ -f "$H" ] || H=$(find $OUT_DIR/soong/.intermediates/hardware/interfaces/wifi/hostapd/$v -name $L \
                  | grep -v unstripped | grep arm64 | grep vendor | awk '{ print length($0), $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
            [ -n "$H" ] && [ -f "$H" ] || { echo "::error::vendor $L not found"
              find $OUT_DIR/soong/.intermediates/hardware/interfaces/wifi/hostapd/$v -name '*.so' | head; exit 1; }
            echo "HAL $v library: $H"
            cp "$H" $W/lib64/
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-strip --strip-unneeded $W/lib64/$L
          done
          ls -la $W/bin $W/lib64
          file $W/bin/hostapd
          strings $W/bin/hostapd | grep -E "^hostapd v|hostapd@1\.[0-9]" | sort -u
          OK=0
          python3 $GITHUB_WORKSPACE/tree17/tools/wifi/check_vendor_abi.py /home/runner/vndk $P $W/bin/hostapd $W/lib64/*.so \
            > $W/vendor_abi.txt && OK=1
          cat $W/vendor_abi.txt
          [ "$OK" = 1 ] || { echo "::error::WPA3 hotspot hostapd: VNDK 28 check failed (vendor_abi.txt above), no zip"; exit 1; }
          sed -n 's/^   NEEDED \(.*\): not in VNDK 28 nor LLNDK.*/\1/p' $W/vendor_abi.txt | sort -u > $W/vendor_needed.txt
          echo "hostapd wpa_supplicant_8 lineage-18.1, LineageOS 16.0 tree (VNDK 28), $(date -u +%Y%m%d) ${GITHUB_SHA::7}" > $W/version
          (cd $W && sha256sum bin/hostapd lib64/android.hardware.wifi.hostapd@1.1.so lib64/android.hardware.wifi.hostapd@1.2.so > SHA256SUMS)
          python3 $GITHUB_WORKSPACE/tree17/tools/make_hotspot_zips.py $W /home/runner/hostapd-zips
          (cd /home/runner/hostapd-zips && cp $W/vendor_abi.txt . && sha256sum *.zip vendor_abi.txt > SHA256SUMS && cat SHA256SUMS)

      # Tag on the tip of the branch (the workflow token may not tag an older commit whose workflows differ)
      - name: WPA3 hotspot zips release (wifi-wpa3-hotspot)
        if: github.ref == 'refs/heads/lineage-17.1'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /home/runner/hostapd-zips
        run: |
          T=wifi-wpa3-hotspot
          N="Build ${GITHUB_SHA::7} du $(date -u +%d/%m/%Y) (hostapd de LineageOS 18.1 construit dans l'arbre LineageOS 16.0 : VNDK 28 natif). librehu_wifi_wpa3_hotspot_twrp.zip : hostapd HAL 1.2 (WPA3 pour le partage de connexion) dans /vendor, originaux sauvegardes dans /sdcard/LibreHU/backup/hostapd-orig. librehu_wifi_wpa3_hotspot_restore_twrp.zip : retour au hostapd d'origine (HAL 1.0). Android 11 et plus seulement (Android 10 n'a pas de WPA3 au point d'acces) ; la ROM doit mettre config_wifi_softap_sae_supported. vbmeta : verification desactivee. EXPERIMENTAL : rapport de compatibilite vendor_abi.txt."
          for i in 1 2 3; do
            { gh release view $T --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                gh release create $T --repo "$GITHUB_REPOSITORY" --target lineage-17.1 --prerelease \
                  --title "WPA3 pour le partage de connexion, Android 11+ (hostapd HAL 1.2)" --notes "$N"; } && \
              gh release edit $T --repo "$GITHUB_REPOSITORY" --notes "$N" && \
              gh release upload $T librehu_wifi_wpa3_hotspot_twrp.zip librehu_wifi_wpa3_hotspot_restore_twrp.zip vendor_abi.txt \
                SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY" && break
            [ $i = 3 ] && exit 1
            echo "attempt $i of 3 failed, again in 90 s"; sleep 90
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifi-wpa3-hotspot
          path: |
            /home/runner/hostapd
            /home/runner/hostapd-zips
            /home/runner/hostapd-build.log
          retention-days: 30
          if-no-files-found: ignore
