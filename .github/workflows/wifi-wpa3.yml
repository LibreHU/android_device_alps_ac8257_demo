name: WPA3 supplicant (HAL 1.2) for the Android 10+ ROMs

# wpa_supplicant_8 of LineageOS 17.1 (HAL 1.2: WPA3 / SAE, OWE, named Wi-Fi Direct groups) with the MediaTek private
# library, built in the LineageOS 16.0 tree, VNDK 28 check (tools/wifi/check_vendor_abi.py), librehu_wifi_wpa3_twrp.zip
# and its way back published in release wifi-wpa3-17.1 (LibreHU-flashablesZips republishes them in LibreHU Apps). Every
# LibreHU ROM of Android 10 or newer runs on the same Android 9 vendor (VNDK 28): the ROM builds take this package from
# the release (tools/ci/fetch_wifi_wpa3.sh) and put it in their zip, none compiles it. Runs when the Wi-Fi files change,
# or by hand. Back on 20/11/2026 (removed on 19/11 by mistake).
#
# Why the Android 9 tree: built in the 17.1 tree, the vendor binary needs libraries newer than the unit's VNDK 28 (run
# 44816169320: the hidl-gen code of Android 10 calls getOrCreateCachedBinder and details::registerAsServiceInternal,
# missing from libhidlbase / libhidltransport v28; wpa_supplicant calls sk_pop_free_ex, missing from libcrypto v28): it
# would not start. Pie's hidl-gen, libhidl and BoringSSL are the VNDK 28 ones. In the 16.0 tree: external/wpa_supplicant_8
# of lineage-17.1, hardware/interfaces/wifi/supplicant/1.2 of lineage-17.1 (.hal files; Android.bp in Pie's form), this
# branch's wifi/ (lib_driver_cmd_mt66xx) and BOARD_WPA_SUPPLICANT_* added to the device tree of lineage-16.0 (in the
# runner only: the 16.0 branch does not change). The check compares with the VNDK 28 snapshot that the Android 10+ ROMs
# install (AOSP prebuilts/vndk/v28, android-10.0.0_r41).
on:
  push:
    branches: [lineage-17.1]
    paths:
      - 'wifi/**'
      - 'tools/wifi/**'
      - 'tools/flashable/wifi-wpa3.sh'
      - 'tools/make_wifi_zips.py'
      - '.github/workflows/wifi-wpa3.yml'
  workflow_dispatch:

jobs:
  build:
    concurrency:
      group: wifi-wpa3-17.1
      cancel-in-progress: true
    # release wifi-wpa3-17.1
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      SRC: /mnt/lineage
      OUT_DIR: /home/runner/out
      CCACHE_DIR: /home/runner/.ccache
      USE_CCACHE: "0"
      CCACHE_EXEC: /usr/bin/ccache
      WITHOUT_CHECK_API: "true"
      # No VNDK ABI dumps (header-abi-dumper on every source file of the VNDK libraries, ~1 h on the runner): a
      # check of the build only, the libraries and the images are the same (cc/cc.go, createVndkSourceAbiDump).
      SKIP_ABI_CHECKS: "true"
      LC_ALL: C
    steps:
      - name: Free the runner's disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm /usr/local/julia* /opt/az \
            /usr/local/share/vcpkg /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/share/kotlinc /opt/pipx /usr/local/n /usr/share/sbt /usr/share/gradle-* /usr/share/apache-maven-* \
            "$HOME/.rustup" "$HOME/.cargo"
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo apt-get remove -y --purge '^llvm-.*' '^clang-.*' '^php.*' '^mysql-.*' '^mongodb-.*' '^dotnet-.*' \
            azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel >/dev/null 2>&1 || true
          # Never rm -rf a directory of a deb package (google-cloud-cli's /usr/lib/google-cloud-sdk did): its removal
          # script fails, dpkg is left half done and apt-get stops with code 100 (run 43237368518).
          sudo apt-get autoremove -y >/dev/null 2>&1 || true; sudo apt-get clean
          sudo mkdir -p "$SRC" && sudo chown "$USER" "$SRC"
          df -h / /mnt

      - name: Swap (8 GiB)
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -g

      - name: Build packages (LineageOS wiki, as for Pie; Android 10's build scripts are still Python 2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python2 zstd git-lfs >/dev/null
          # Android 10's build scripts are still Python 2 ("python").
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          mkdir -p ~/bin && curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "LibreHU CI"
          git config --global user.email "ci@librehu.invalid"
          git config --global color.ui false

      # this branch (lineage-17.1): wifi/, tools/wifi/check_vendor_abi.py, tools/make_wifi_zips.py, wifi-wpa3.sh
      - uses: actions/checkout@v4
        with:
          path: tree17

      - name: Sources (LineageOS 16.0 tree, wpa_supplicant_8 and supplicant HAL 1.2 of LineageOS 17.1)
        working-directory: /mnt/lineage
        run: |
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1 -g default,-darwin,-mips --no-clone-bundle
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/ujc201.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="LibreHU/android_device_alps_ac8257_demo" path="device/alps/ac8257_demo" remote="github" revision="lineage-16.0" />
            <project name="LibreHU/android_vendor_jancar_ac8257_demo" path="vendor/jancar/ac8257_demo" remote="github" revision="lineage-16.0" />
            <remove-project name="LineageOS/android_external_wpa_supplicant_8" />
            <project path="external/wpa_supplicant_8" name="LineageOS/android_external_wpa_supplicant_8" remote="github" revision="lineage-17.1" />
          </manifest>
          XML
          for i in 1 2 3 4; do
            repo sync -c -j8 --no-tags --no-clone-bundle --optimized-fetch --force-sync && break
            echo "repo sync failed ($i), again"; sleep 60
          done
          # android.hardware.wifi.supplicant@1.2 (Android 10): its .hal files, Android.bp in the form of Pie's hidl-gen
          # (types listed, no Java: only the vendor C++ library is used)
          H=hardware/interfaces/wifi/supplicant/1.2
          git clone -q --depth 1 --filter=blob:none --sparse -b lineage-17.1 \
            https://github.com/LineageOS/android_hardware_interfaces /home/runner/hi17
          (cd /home/runner/hi17 && git sparse-checkout set wifi/supplicant/1.2)
          mkdir -p $H && cp /home/runner/hi17/wifi/supplicant/1.2/*.hal $H/
          T=$(grep -h -o -E '^(enum|struct|union|typedef) +[A-Za-z0-9_]+' $H/types.hal | awk '{ printf "        \"%s\",\n", $2 }')
          printf '%s\n' 'hidl_interface {' '    name: "android.hardware.wifi.supplicant@1.2",' '    root: "android.hardware",' \
            '    vndk: {' '        enabled: true,' '    },' '    srcs: [' > $H/Android.bp
          for f in types.hal ISupplicant.hal ISupplicantP2pIface.hal ISupplicantStaIface.hal ISupplicantStaIfaceCallback.hal \
            ISupplicantStaNetwork.hal; do [ -f $H/$f ] && printf '        "%s",\n' $f >> $H/Android.bp; done
          printf '%s\n' '    ],' '    interfaces: [' '        "android.hardware.wifi.supplicant@1.0",' \
            '        "android.hardware.wifi.supplicant@1.1",' '        "android.hidl.base@1.0",' '    ],' '    types: [' >> $H/Android.bp
          printf '%s\n' "$T" >> $H/Android.bp
          printf '%s\n' '    ],' '    gen_java: false,' '}' >> $H/Android.bp
          ls $H; cat $H/Android.bp
          # MediaTek private library and the Wi-Fi settings of this branch's BoardConfig.mk (runner only)
          D=device/alps/ac8257_demo
          cp -r $GITHUB_WORKSPACE/tree17/wifi $D/
          sed -n '/^WPA_SUPPLICANT_VERSION :=/,/^BOARD_HOSTAPD_PRIVATE_LIB :=/p' $GITHUB_WORKSPACE/tree17/BoardConfig.mk > /home/runner/wpa.mk
          grep -q BOARD_WPA_SUPPLICANT_PRIVATE_LIB /home/runner/wpa.mk || { echo "::error::no Wi-Fi settings in BoardConfig.mk"; exit 1; }
          # supplicant only: Android 10's hostapd needs android.hardware.wifi.hostapd@1.1, absent from Pie (run
          # 44841613929: "hostapd ... missing android.hardware.wifi.hostapd@1.1"); the unit keeps its stock hostapd
          { echo; echo "# LibreHU WPA3 CI (wifi-wpa3.yml): from lineage-17.1, supplicant only"
            grep -v '^BOARD_HOSTAPD_' /home/runner/wpa.mk; echo "BOARD_HOSTAPD_DRIVER :="; } >> $D/BoardConfig.mk
          tail -n 8 $D/BoardConfig.mk
          # the device tree's root Android.mk takes one level of subfolders: wifi/Android.mk takes the rest
          ls $D/wifi $D/wifi/lib_driver_cmd_mt66xx
          (cd external/wpa_supplicant_8 && git log --oneline -1 2>/dev/null; grep -m1 -E "VERSION_STR" src/common/version.h)
          # LineageOS fixes of the 16.0 tree (BoardConfig.mk stops the build if they were not done)
          $D/tools/patch_lineage_sources.sh
          # VNDK 28 snapshot that the Android 10+ ROMs install for the vendor (arm64 shared libraries only)
          git clone -q --depth 1 --filter=blob:none --sparse -b android-10.0.0_r41 \
            https://android.googlesource.com/platform/prebuilts/vndk/v28 /home/runner/vndk/prebuilts/vndk/v28
          (cd /home/runner/vndk/prebuilts/vndk/v28 && git sparse-checkout set arm64/arch-arm64-armv8-a/shared)
          ls /home/runner/vndk/prebuilts/vndk/v28/arm64/arch-arm64-armv8-a/shared
          # The Git objects of the checkout go: room for the output (run 43227394988 stopped at 94 %, 94181/99724, on
          # "No space left on device"). The build reads no Git metadata: prebuilt kernel (TARGET_NO_KERNEL), no OTA
          # package, and repo is not run again; .repo/manifests and .repo/repo stay.
          du -sh .repo; rm -rf .repo/project-objects .repo/projects
          du -sh /mnt/lineage; df -h / /mnt

      - name: LibreHU apps (librehu/fetch_apks.sh), boot images (tools/fetch_kernel.sh), ViPER driver (tools/fetch_viper.sh)
        working-directory: /mnt/lineage/device/alps/ac8257_demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # files the 16.0 product makefiles copy (lunch reads them), as in its ROM build
          librehu/fetch_apks.sh
          tools/fetch_kernel.sh
          # ViPERFX_RE driver of the ROM's ViPER4Android app (same version), for the TWRP zip: installed or updated in /vendor
          tools/fetch_viper.sh
          ls -la prebuilt

      - name: WPA3 supplicant (HAL 1.2), build and VNDK 28 check
        id: wifi
        working-directory: /mnt/lineage
        run: |
          source build/envsetup.sh
          lunch lineage_ac8257_demo-userdebug
          m -j"$(nproc)" wpa_supplicant > /home/runner/wifi-build.log 2>&1 || {
            grep -n -E "FAILED:|error:" /home/runner/wifi-build.log | head -40; tail -n 40 /home/runner/wifi-build.log; exit 1; }
          P=$OUT_DIR/target/product/ac8257_demo
          W=/home/runner/wifi; mkdir -p $W/bin $W/lib64
          cp $P/vendor/bin/hw/wpa_supplicant $W/bin/
          # vendor copy of the HAL 1.2 library (not in the unit's VNDK 28): installed next to the binary, else the
          # vendor arm64 variant of its Soong module (Android 10 names it android_arm64_armv8-a_vendor_shared; the
          # pattern of 19/11, android_vendor*, is Android 11's and found nothing, run 44535055126)
          H=$P/vendor/lib64/android.hardware.wifi.supplicant@1.2.so
          [ -f "$H" ] || H=$(find $OUT_DIR/soong/.intermediates/hardware/interfaces/wifi/supplicant/1.2 \
                -name 'android.hardware.wifi.supplicant@1.2.so' | grep -v unstripped | grep arm64 | grep vendor \
                | awk '{ print length($0), $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          [ -n "$H" ] && [ -f "$H" ] || { echo "::error::vendor android.hardware.wifi.supplicant@1.2.so not found"
            find $OUT_DIR/soong/.intermediates/hardware/interfaces/wifi/supplicant/1.2 -name '*.so' | head -20; exit 1; }
          echo "HAL 1.2 library: $H"
          cp "$H" $W/lib64/
          ls -la $W/bin $W/lib64 $P/vendor/lib64 2>/dev/null | head -60
          file $W/bin/wpa_supplicant
          strings $W/bin/wpa_supplicant | grep -E "^wpa_supplicant v|supplicant@1\.[0-9]" | sort -u
          OK=0
          python3 $GITHUB_WORKSPACE/tree17/tools/wifi/check_vendor_abi.py /home/runner/vndk $P $W/bin/wpa_supplicant $W/lib64/*.so \
            > $W/vendor_abi.txt && OK=1
          cat $W/vendor_abi.txt
          [ "$OK" = 1 ] || { echo "::error::WPA3 supplicant: VNDK 28 check failed (vendor_abi.txt above), no zip"; exit 1; }
          # libraries the unit's vendor must have (checked again by the installer before it changes anything)
          sed -n 's/^   NEEDED \(.*\): not in VNDK 28 nor LLNDK.*/\1/p' $W/vendor_abi.txt | sort -u > $W/vendor_needed.txt
          echo "wpa_supplicant_8 lineage-17.1, LineageOS 16.0 tree (VNDK 28), $(date -u +%Y%m%d) ${GITHUB_SHA::7}" > $W/version
          (cd $W && sha256sum bin/wpa_supplicant lib64/android.hardware.wifi.supplicant@1.2.so > SHA256SUMS)
          python3 $GITHUB_WORKSPACE/tree17/tools/make_wifi_zips.py $W /home/runner/wifi-zips
          (cd /home/runner/wifi-zips && cp $W/vendor_abi.txt . && sha256sum *.zip vendor_abi.txt > SHA256SUMS && cat SHA256SUMS)
          touch $W/ABI_OK

      # Tag on the tip of the branch, never on an older commit: the workflow token may not create a tag on a commit
      # whose .github/workflows differ from the tip (HTTP 403, tools/ci/publish_release.sh). The notes name the commit
      # built.
      - name: WPA3 zips release (wifi-wpa3-17.1)
        if: github.ref == 'refs/heads/lineage-17.1'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /home/runner/wifi-zips
        run: |
          T=wifi-wpa3-17.1
          N="Build ${GITHUB_SHA::7} du $(date -u +%d/%m/%Y) (wpa_supplicant_8 de LineageOS 17.1 construit dans l'arbre LineageOS 16.0 : VNDK 28 natif). librehu_wifi_wpa3_twrp.zip : wpa_supplicant HAL 1.2 (WPA3 / SAE, OWE, Wi-Fi Direct nomme) dans /vendor, originaux sauvegardes dans /sdcard/LibreHU/backup/wifi-hal11-orig. librehu_wifi_wpa3_restore_twrp.zip : retour au supplicant d'origine (HAL 1.1). Pour les ROM LibreHU Android 10 et plus (le framework d'Android 9 n'a pas WPA3) ; les zips des ROM l'embarquent. vbmeta : verification desactivee. EXPERIMENTAL : rapport de compatibilite vendor_abi.txt."
          for i in 1 2 3; do
            { gh release view $T --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                gh release create $T --repo "$GITHUB_REPOSITORY" --target lineage-17.1 --prerelease \
                  --title "WPA3 pour les ROM Android 10+ (wpa_supplicant HAL 1.2)" --notes "$N"; } && \
              gh release edit $T --repo "$GITHUB_REPOSITORY" --notes "$N" && \
              gh release upload $T librehu_wifi_wpa3_twrp.zip librehu_wifi_wpa3_restore_twrp.zip vendor_abi.txt SHA256SUMS \
                --clobber --repo "$GITHUB_REPOSITORY" && break
            [ $i = 3 ] && exit 1
            echo "attempt $i of 3 failed, again in 90 s"; sleep 90
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifi-wpa3-17.1
          path: |
            /home/runner/wifi
            /home/runner/wifi-zips
            /home/runner/wifi-build.log
          retention-days: 30
          if-no-files-found: ignore
