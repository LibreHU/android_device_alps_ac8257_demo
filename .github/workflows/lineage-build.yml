name: LineageOS 16.0 build (lineage_ac8257_demo)

# The ROM's /system built by GitHub Actions, to find the build errors before a build at home (docs/BUILD.md does
# the same steps). Only `systemimage`: the vendor image is the user's own (never published) and the boot image is
# the LibreHU kernel's CI image. Runs on a push to lineage-16.0 whose message holds "[build]", or by hand.
# Disk (146 GB, /mnt on the same disk): the runner's toolchains are removed, and the Git objects of the checkout
# after the sync; sources in /mnt, output and ccache in /.
# Outputs: the build log always; when it builds: a TWRP zip (tools/make_flashable_zip.py), system.img (sparse,
# zstd) and the LibreHU boot images for fastboot.
on:
  push:
    branches: [lineage-16.0]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    # On the job, not the workflow: a push without "[build]" (skipped job) does not cancel a build in progress.
    concurrency:
      group: lineage-build
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      SRC: /mnt/lineage
      OUT_DIR: /home/runner/out
      CCACHE_DIR: /home/runner/.ccache
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      WITHOUT_CHECK_API: "true"
      # No VNDK ABI dumps (header-abi-dumper on every source file of the VNDK libraries, ~1 h on the runner): a
      # check of the build only, the libraries and the images are the same (cc/cc.go, createVndkSourceAbiDump).
      SKIP_ABI_CHECKS: "true"
      LC_ALL: C
    steps:
      - name: Free the runner's disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm /usr/local/julia* /opt/az \
            /usr/local/share/vcpkg /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/share/kotlinc /opt/pipx /usr/local/n /usr/share/sbt /usr/share/gradle-* /usr/share/apache-maven-* \
            "$HOME/.rustup" "$HOME/.cargo"
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo apt-get remove -y --purge '^llvm-.*' '^clang-.*' '^php.*' '^mysql-.*' '^mongodb-.*' '^dotnet-.*' \
            azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel >/dev/null 2>&1 || true
          # Never rm -rf a directory of a deb package (google-cloud-cli's /usr/lib/google-cloud-sdk did): its removal
          # script fails, dpkg is left half done and apt-get stops with code 100 (run 43237368518).
          sudo apt-get autoremove -y >/dev/null 2>&1 || true; sudo apt-get clean
          sudo mkdir -p "$SRC" && sudo chown "$USER" "$SRC"
          df -h / /mnt

      # 8 GiB: the build in its 13 GiB cgroup used 1.1 GiB of swap at most (run 43227394988), and the disk is short.
      - name: Swap (8 GiB)
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -g

      - name: Build packages (LineageOS wiki, Pie)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python2 zstd git-lfs >/dev/null
          # Pie's build scripts are Python 2.
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          mkdir -p ~/bin && curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "LibreHU CI"
          git config --global user.email "ci@librehu.invalid"
          git config --global color.ui false

      - name: Sources (LineageOS 16.0, this tree, the vendor repository)
        working-directory: /mnt/lineage
        run: |
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1 -g default,-darwin,-mips --no-clone-bundle
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/ujc201.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="LibreHU/android_device_alps_ac8257_demo" path="device/alps/ac8257_demo" remote="github" revision="lineage-16.0" />
            <project name="LibreHU/android_vendor_jancar_ac8257_demo" path="vendor/jancar/ac8257_demo" remote="github" revision="lineage-16.0" />
          </manifest>
          XML
          for i in 1 2 3 4; do
            repo sync -c -j8 --no-tags --no-clone-bundle --optimized-fetch --force-sync && break
            echo "repo sync failed ($i), again"; sleep 60
          done
          # The WebView prebuilt is a Git LFS file (243 MB); repo sync leaves its pointer, and the build stops on
          # "zip END header not found" (run of 12/11). Only arm64 is used (its APK holds the 32-bit library too).
          (cd external/chromium-webview/prebuilt/arm64 && git lfs install --local && git lfs pull)
          unzip -tq external/chromium-webview/prebuilt/arm64/webview.apk >/dev/null && echo "webview.apk: zip OK"
          # The Git objects of the checkout go: room for the output (run 43227394988 stopped at 94 %, 94181/99724, on
          # "No space left on device"). The build reads no Git metadata: prebuilt kernel (TARGET_NO_KERNEL), no OTA
          # package, and repo is not run again; .repo/manifests and .repo/repo stay.
          du -sh .repo; rm -rf .repo/project-objects .repo/projects
          du -sh /mnt/lineage; df -h / /mnt

      - name: LibreHU apps (librehu/fetch_apks.sh) and boot images (tools/fetch_kernel.sh)
        working-directory: /mnt/lineage/device/alps/ac8257_demo
        run: |
          librehu/fetch_apks.sh
          # LibreHU kernel stable-4.9.337: boot images with the stock AVB footer, androidboot.selinux=permissive added
          tools/fetch_kernel.sh
          ls -la prebuilt

      - name: ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: lineage-ccache-${{ github.sha }}
          restore-keys: lineage-ccache-

      - name: Build systemimage
        id: build
        working-directory: /mnt/lineage
        timeout-minutes: 290
        run: |
          ccache -M 8G >/dev/null; ccache -o compression=true >/dev/null 2>&1 || true
          # The build in a memory cgroup of its own (13 GiB of RAM, 8 GiB of swap): short of memory, the kernel swaps
          # or kills a build process inside it, never the runner. A runner starved of memory loses its link to GitHub,
          # and the whole log with it ("The hosted runner lost communication with the server", run 43184707906).
          CG=/sys/fs/cgroup/lineage-build
          if [ -f /sys/fs/cgroup/cgroup.controllers ] && sudo mkdir -p $CG \
              && echo 13G | sudo tee $CG/memory.max >/dev/null \
              && { [ ! -f $CG/memory.swap.max ] || echo 8G | sudo tee $CG/memory.swap.max >/dev/null; } \
              && echo $$ | sudo tee $CG/cgroup.procs >/dev/null; then
            echo "build cgroup: memory.max $(cat $CG/memory.max), memory.swap.max $(cat $CG/memory.swap.max 2>/dev/null)"
          else
            echo "no build cgroup (cgroup v2 not writable): the build runs without a memory limit"
          fi
          source build/envsetup.sh
          lunch lineage_ac8257_demo-userdebug
          # Progress, memory and free disk every 5 minutes; the whole log is an artifact.
          ( while sleep 300; do
              echo "$(tail -n 1 /home/runner/build.log | cut -c1-160) | $(free -m | awk '/^Mem/{r=$3} /^Swap/{s=$3} END{print "RAM " r " MiB, swap " s " MiB"}'), disk $(df -h / | awk 'NR==2{print $4}') free"
            done ) &
          m -j"$(nproc)" systemimage > /home/runner/build.log 2>&1
        continue-on-error: true

      - name: What failed
        if: always()
        run: |
          grep -n -E "FAILED:|error:|ninja: build stopped|#### failed|neverallow" /home/runner/build.log | head -80 || true
          tail -n 60 /home/runner/build.log || true
          df -h / /mnt; ccache -s | head -20 || true
          # oom_kill > 0: a build process was killed for memory (the FAILED line above names it)
          grep -H . /sys/fs/cgroup/lineage-build/memory.events /sys/fs/cgroup/lineage-build/memory.peak 2>/dev/null || true

      - name: Images to flash (system.img zstd, boot images)
        if: steps.build.outcome == 'success'
        run: |
          P=$OUT_DIR/target/product/ac8257_demo
          ls -la $P | head -40
          mkdir -p /home/runner/flash
          zstd -T0 -10 $P/system.img -o /home/runner/flash/system.img.zst
          cp /mnt/lineage/device/alps/ac8257_demo/prebuilt/boot-librehu-bootmenu.img \
             /mnt/lineage/device/alps/ac8257_demo/prebuilt/boot-librehu.img /home/runner/flash/
          cp $P/system/build.prop /home/runner/flash/build.prop || true
          # TWRP zip (tools/make_flashable_zip.py): system, boot (selinux permissive), modules of the same kernel
          D=$(date -u +%Y%m%d)
          python3 /mnt/lineage/device/alps/ac8257_demo/tools/make_flashable_zip.py $P/system.img \
            /mnt/lineage/device/alps/ac8257_demo/prebuilt /home/runner/flash/LibreHU-LineageOS-16.0-ac8257_demo-$D.zip \
            --build "lineage-16.0 $D, tree ${GITHUB_SHA::7}, kernel $(sed -n 's/^version=//p' /mnt/lineage/device/alps/ac8257_demo/prebuilt/modules/release.txt)"
          (cd /home/runner/flash && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      # The images are out: the output goes, room for the ccache archive (its save failed on a full disk, run
      # 43227394988).
      - name: Room for the ccache archive
        if: always()
        run: rm -rf "$OUT_DIR"; df -h /

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: lineage-ccache-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineage-build-log
          path: /home/runner/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: lineage-images
          path: /home/runner/flash
          retention-days: 14

      - name: Result
        if: always()
        run: test "${{ steps.build.outcome }}" = success
