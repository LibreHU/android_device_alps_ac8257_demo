# ujc201_keys.conf - touches au volant -> touches TWRP (lu par touchfix)
# Table par defaut (vide) : les valeurs dependent du vehicule. Apprentissage : Advanced > Steering wheel keys: learn
# (ou "wheelkeys learn" dans le terminal) -> /data/media/0/TWRP/ujc201_keys.conf, prioritaire sur ce fichier.
#
# <canal> <octet 1..4> <min> <max> <action> [nom]
#   canal : 1 telecommande IR, 2 molette, 3/4 touches AD, 5/6 volant (trame MCU 0x20 = canal v1 v2 v3 v4),
#           7 boitier CAN Hiworld (octet 1 = code de la touche, message 0x11 relaye par le MCU en trames 0x10)
#   Sans ligne ici, le canal 7 suit la table Hiworld LNP002 de touchfix : 1 VOL+ volup, 2 VOL- voldown,
#   3/18 MUTE enter, 15 OK enter, 19 ANSWER enter, 13/5 PREV up, 14/6 NEXT down, 8 right, 9 left,
#   10 MODE back, 20 HANG UP back, 4 NAVI home (codes > 31 : leurs 5 bits bas). Exemple : 7 1 17 17 back SRC
#   actions : volup voldown enter back home power up down left right bl+ bl- none
#   dans TWRP : voldown/volup = element suivant/precedent, up/down/left/right = voisin, enter = appui
# Exemple :
# 5 2 40 46 volup VOL+
